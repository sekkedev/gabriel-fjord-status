<title>Gabriel – skjerm</title>
<link rel="icon" type="image/webp" href="__ASSET_icon-oxygen__">
<style>
/*__BASE_CSS__*/

/* Screen: for a small public screen (Bybanen). No sound and no touch, and people look for a few seconds,
   so one big fact per slide, Gabby with a bit of life, and a QR code for the few who want more. */
html,body{height:100%}
body{overflow:hidden}
[hidden]{display:none !important}
.screen{height:100%;display:grid;grid-template-rows:1fr auto;
  padding:4vmin max(4vmin,env(safe-area-inset-right,0px)) 3vmin max(4vmin,env(safe-area-inset-left,0px))}
.slides{position:relative;min-height:0}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:5vmin;
  opacity:0;transition:opacity .6s var(--ease)}
.slide.on{opacity:1}

/* Gabby: floats on a wave, blinks, and pops in with each slide */
.pal{position:relative;width:34vmin;height:34vmin;animation:bob 4.2s ease-in-out infinite}
.face{width:100%;height:100%;display:block;border-radius:50%;clip-path:circle(50%);background:var(--card)}
.slide.on .pal{animation:pop .8s var(--ease) both,bob 4.2s ease-in-out .8s infinite}
.face .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.face .w1{fill:var(--layer-1);opacity:.75;animation:drift 3.2s linear infinite}
.face .w2{fill:var(--layer-2);opacity:.9;animation:drift 2.4s linear infinite reverse}
.face .drop{stroke:var(--accent);stroke-width:3;stroke-linecap:round;animation:fall 1.1s linear infinite}
.face .bub{fill:var(--bubble);stroke:var(--sea-1);stroke-width:1.2;animation:rise 2.6s ease-in infinite}
.badge{position:absolute;top:-1vmin;right:-1vmin;width:10vmin;height:10vmin;border-radius:50%;display:grid;place-items:center;
  background:var(--accent);color:var(--pill-fg);font:800 7vmin/1 var(--display);box-shadow:0 .6vmin 1.6vmin var(--shadow);animation:wiggle 1.8s ease-in-out infinite}
.text{display:grid;gap:2.2vmin;min-width:0}
.slide.on .text>*{animation:up .7s var(--ease) both}
.slide.on .text>:nth-child(2){animation-delay:.12s}
.slide.on .text>:nth-child(3){animation-delay:.24s}
.kicker{font:700 3.6vmin/1.2 var(--display);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.big{font:800 9vmin/1.05 var(--display);text-wrap:balance}
.big.num{font-size:20vmin;font-variant-numeric:tabular-nums}
.line{font-size:4vmin;line-height:1.35;color:var(--muted);max-width:32ch;text-wrap:pretty}

.bar{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:3vmin;padding-top:2.5vmin;border-top:1px solid var(--line)}
.timer{position:absolute;top:-1px;left:0;height:2px;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.timer.go{animation:fill var(--ms) linear both}
.qr{width:clamp(120px,22vmin,30vh);height:clamp(120px,22vmin,30vh);display:block;border-radius:6px;background:#fff;padding:6px}   /* white behind the code in both themes, or phones can't read it */
.more{display:grid;gap:.6vmin;min-width:0}
.more b{font:700 3.6vmin/1.2 var(--display)}
.more span{font-size:max(13px,2.2vmin);line-height:1.35;color:var(--muted)}
.dots{display:flex;gap:1.2vmin}
.dots i{width:1.6vmin;height:1.6vmin;border-radius:50%;background:var(--muted);opacity:.35;transition:opacity .3s,transform .3s}
.dots i.on{background:var(--accent);opacity:1;transform:scale(1.3)}

@keyframes bob{0%,100%{transform:translateY(-1vmin) rotate(-2deg)}50%{transform:translateY(1vmin) rotate(2deg)}}
@keyframes pop{0%{transform:scale(.55) rotate(-8deg);opacity:0}60%{transform:scale(1.08) rotate(3deg);opacity:1}100%{transform:scale(1) translateY(-1vmin) rotate(-2deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes drift{to{transform:translateX(-40px)}}
@keyframes fall{0%{transform:translateY(-30px);opacity:0}25%{opacity:1}100%{transform:translateY(45px);opacity:0}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-55px);opacity:0}}
@keyframes wiggle{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg) scale(1.08)}}
@keyframes up{from{transform:translateY(3vmin);opacity:0}to{transform:none;opacity:1}}
@keyframes fill{to{transform:scaleX(1)}}

/* portrait screens: face on top, text below */
@media (max-aspect-ratio:1/1){
  .slide{grid-template-columns:minmax(0,1fr);align-content:center;justify-items:start}
  .pal{width:28vmin;height:28vmin}
  .big{font-size:10vmin} .big.num{font-size:24vmin} .line{font-size:4.6vmin}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none !important;transition:none !important} }
</style>

<svg class="defs" aria-hidden="true" focusable="false"><defs>
  <image id="art-buoy" href="__ASSET_buoy__" width="600" height="736"/>
</defs></svg>

<main class="screen">
  <div class="slides" id="slides" role="region"></div>
  <footer class="bar">
    <i class="timer" id="timer" aria-hidden="true"></i>
    <img class="qr" src="__ASSET_qr-site__" alt="" id="qr">
    <div class="more"><b id="more"></b><span id="when"></span><span id="cite"></span></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </footer>
</main>

<script>
const D = __DATA__;
const NB=' ';
const SLIDE_MS=8000;
const CITATION="Muilwijk, M., Drange, H., Paasche, Ø. (2017). Gabriel conductivity-temperature-depth (CTD), oxygen, fluorescence and turbidity data from Store Lungegårdsvann in Bergen [Data set]. University of Bergen, Norway.";
const T={
 no:{loc:'nb-NO',title:"Gabriel – skjerm",region:"Fakta fra Gabriel-bøya",carousel:"karusell",slide:"lysbilde",
  place:"Store Lungegårdsvann, ved Bystasjonen",
  temp:{line:d=>`i overflaten, målt ${d}.`,warmer:(T,z)=>`Litt lenger ned er det varmere: ${T}${NB}°C på ${z}${NB}m.`},
  rain:{kicker:"Bergensregnet havner her",big:"Regnet flyter oppå fjorden",
   line:(s,b)=>`Saltholdighet ${s} øverst og ${b} ved bunnen (havet: rundt 35). Ferskvann er lettere, så det legger seg oppå.`},
  quiz:{kicker:"Gjett",big:z=>`Hvor mye oksygen er det ved bunnen, ${z}${NB}m ned?`,line:"Svaret kommer straks."},
  ans:{kicker:"Svaret",big:o=>o<10?`Nesten ingenting: ${fmt(o,0)}${NB}% metning`:`${fmt(o,0)}${NB}% metning`,
   line:s=>`Øverst: ${s}${NB}% metning. Bunnvannet byttes sjelden ut, så livet der nede bruker opp oksygenet.`},
  more:"Se mer: gabriel.sekke.dev",qr:"QR-kode til gabriel.sekke.dev",
  when:d=>`Dykk ${d}, målt av Gabriel-bøya. Prototype, ikke en offisiell side fra UiB.`,
  cite:`Data: ${CITATION}`},
 en:{loc:'en-GB',title:"Gabriel – screen",region:"Facts from the Gabriel buoy",carousel:"carousel",slide:"slide",
  place:"Store Lungegårdsvann, by Bystasjonen",
  temp:{line:d=>`at the surface, measured ${d}.`,warmer:(T,z)=>`A little deeper it is warmer: ${T}${NB}°C at ${z}${NB}m.`},
  rain:{kicker:"Bergen's rain ends up here",big:"The rain floats on top of the fjord",
   line:(s,b)=>`Salinity ${s} at the top and ${b} at the bottom (the open sea: about 35). Fresh water is lighter, so it settles on top.`},
  quiz:{kicker:"Guess",big:z=>`How much oxygen is there at the bottom, ${z}${NB}m down?`,line:"The answer is coming up."},
  ans:{kicker:"The answer",big:o=>o<10?`Almost none: ${fmt(o,0)}${NB}% saturation`:`${fmt(o,0)}${NB}% saturation`,
   line:s=>`At the top: ${s}${NB}% saturation. The bottom water is rarely replaced, so life down there uses up the oxygen.`},
  more:"See more: gabriel.sekke.dev",qr:"QR code for gabriel.sekke.dev",
  when:d=>`Dive on ${d}, measured by the Gabriel buoy. Prototype, not an official UiB page.`,
  cite:`Data: ${CITATION}`}
};
// Norwegian unless the URL asks for English: a kiosk browser's own language says nothing about who is riding the tram
const L=new URLSearchParams(location.search).get('lang')==='en'?'en':'no', t=T[L];
document.documentElement.lang=L==='no'?'nb':'en';
document.title=t.title;
function fmt(v,d=1){ if(v==null||Number.isNaN(v)) return '–'; return v.toLocaleString(t.loc,{minimumFractionDigits:d,maximumFractionDigits:d}); }
const reduced=matchMedia('(prefers-reduced-motion: reduce)');

// ---------- facts from the latest dive: rows are [depth, T, S, O, Tu, F] ----------
const rows=D.profile, surf=rows.filter(r=>r[0]<2), bot=rows[rows.length-1];
const avg=k=>{ const v=surf.map(r=>r[k]).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b)/v.length:null; };
const sT=avg(1), sS=avg(2), sO=avg(3);
const warm=rows.reduce((m,r)=>r[1]!=null&&r[1]>m[1]?r:m,[null,-Infinity]);
const dived=new Date(D.last.replace(' ','T'));
const day=dived.toLocaleDateString(t.loc,{day:'numeric',month:'long'});

// ---------- Gabby: the same face as gabby.html, on a wave, plus a little extra per slide ----------
const EYES=`<g class="eye"><ellipse cx="270" cy="364" rx="14" ry="17" fill="#1b2230"/><circle cx="275.5" cy="357" r="5.5" fill="#fff"/><circle cx="265" cy="371.5" r="2.4" fill="#fff" opacity=".8"/></g>
<g class="eye"><ellipse cx="330" cy="364" rx="14" ry="17" fill="#1b2230"/><circle cx="335.5" cy="357" r="5.5" fill="#fff"/><circle cx="325" cy="371.5" r="2.4" fill="#fff" opacity=".8"/></g>`;
const CHEEKS=c=>`<ellipse cx="247" cy="389" rx="10" ry="5.5" fill="${c}" opacity=".5"/><ellipse cx="353" cy="389" rx="10" ry="5.5" fill="${c}" opacity=".5"/>`;
const MOUTH={
  calm:'<path d="M290 389q10 8 20 0" fill="none" stroke="#1b2230" stroke-width="4" stroke-linecap="round"/>',
  clear:'<path d="M287 386h26q0 13-13 13t-13-13z" fill="#1b2230"/><ellipse cx="300" cy="395.5" rx="5.5" ry="2.8" fill="#f08a8a"/>',
  fresh:'<ellipse cx="300" cy="392" rx="5.5" ry="7" fill="#1b2230"/>',
  cold:'<path d="M286 393q3.5-4.5 7 0t7 0t7 0t7 0" fill="none" stroke="#1b2230" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>'
};
const face=m=>EYES+CHEEKS(m==='cold'?'#7fb6ea':'#f08a8a')+MOUTH[m];
const wave=(y,c)=>`<path class="${c}" d="M150 ${y}q10-6 20 0${'t20 0'.repeat(15)}V520H150Z"/>`;
const FX={
  rain:[212,236,262,338,364,390,226,378].map((x,i)=>`<line class="drop" x1="${x}" y1="300" x2="${x-3}" y2="312" style="animation-delay:${(i*.14).toFixed(2)}s"/>`).join(''),
  ans:[[262,6],[300,4],[338,5],[282,3.5],[322,3]].map(([x,r],i)=>`<circle class="bub" cx="${x}" cy="495" r="${r}" style="animation-delay:${(i*.5).toFixed(1)}s"/>`).join('')
};
const pal=(m,fx)=>`<div class="pal" aria-hidden="true"><svg class="face" viewBox="190 285 220 220">${fx==='rain'?FX.rain:''}<use href="#art-buoy"/>${face(m)}`
  +`${wave(462,"w1")}${wave(471,"w2")}${fx==='ans'?FX.ans:''}</svg>${fx==='quiz'?'<span class="badge">?</span>':''}</div>`;

// ---------- slides: [face, effect, kicker, big, line, count-up number] ----------
const S=[[ 'clear','temp', t.place, `${fmt(sT)}${NB}°C`,
  t.temp.line(day)+(warm[1]>=sT+1?' '+t.temp.warmer(fmt(warm[1]),fmt(warm[0],0)):''), sT ]];
if(bot[2]-sS>=3) S.push(['fresh','rain', t.rain.kicker, t.rain.big, t.rain.line(fmt(sS,0),fmt(bot[2],0))]);   // only when there is a real fresh layer
S.push(['calm','quiz', t.quiz.kicker, t.quiz.big(fmt(bot[0],0)), t.quiz.line],
       ['cold','ans', t.ans.kicker, t.ans.big(bot[3]), t.ans.line(fmt(sO,0))]);

const box=document.getElementById('slides'), dots=document.getElementById('dots'), timer=document.getElementById('timer');
box.setAttribute('aria-roledescription',t.carousel); box.setAttribute('aria-label',t.region);
box.innerHTML=S.map(([m,fx,k,b,l,n],i)=>`<section class="slide" aria-roledescription="${t.slide}" aria-label="${i+1} / ${S.length}">${pal(m,fx)}`
  +`<div class="text"><p class="kicker">${k}</p><p class="big${n!=null?' num':''}">${b}</p><p class="line">${l}</p></div></section>`).join('');
dots.innerHTML=S.map(()=>'<i></i>').join('');
document.getElementById('more').textContent=t.more;
document.getElementById('qr').alt=t.qr;
document.getElementById('when').textContent=t.when(dived.toLocaleString(t.loc,{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}));
document.getElementById('cite').textContent=t.cite;

// the temperature counts up to its value when its slide comes in
function countUp(el,v){
  if(reduced.matches||v==null) return;
  const t0=performance.now(), from=v-6, end=el.textContent;
  (function step(now){ const k=Math.min(1,(now-t0)/900), e=1-(1-k)**3;
    el.textContent=k<1?`${fmt(from+(v-from)*e)}${NB}°C`:end; if(k<1) requestAnimationFrame(step); })(t0);
}

// ---------- rotation; ?slide=N holds one slide (for testing), arrow keys step for a presenter ----------
const hold=new URLSearchParams(location.search).get('slide');
let cur=0, tick=null;
function show(i){
  cur=((i%S.length)+S.length)%S.length;
  [...box.children].forEach((el,j)=>{ el.classList.toggle('on',j===cur); el.setAttribute('aria-hidden',j!==cur); });
  [...dots.children].forEach((el,j)=>el.classList.toggle('on',j===cur));
  const n=S[cur][5]; if(n!=null) countUp(box.children[cur].querySelector('.big'),n);
  timer.classList.remove('go'); if(hold==null){ void timer.offsetWidth; timer.classList.add('go'); }   // restart the bar
}
function run(){ clearInterval(tick); if(hold==null) tick=setInterval(()=>show(cur+1),SLIDE_MS); }
timer.style.setProperty('--ms',SLIDE_MS+'ms');
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){ show(cur+1); run(); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ show(cur-1); run(); }
});
show(hold!=null?Math.min(Math.max(parseInt(hold,10)||1,1),S.length)-1:0); run();
</script>
