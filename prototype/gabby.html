<style>
/*__BASE_CSS__*/

/* Gabby: a labelled demo of the organisers' "daily post" idea, laid out like a photo-sharing app's mobile profile.
   No Instagram name, logo or login UI, and our own icons. Every post is generated from one day of real
   measurements; follower and like counts are illustrative, and the page says so. */
:root{
  --calm-1:#dbe8fd; --calm-2:#9bbcf3; --clear-1:#d6f2f5; --clear-2:#7fc8d6;
  --fresh-1:#efe4cf; --fresh-2:#c9a46e; --algae-1:#dcf3e2; --algae-2:#7cc59a;
  --cold-1:#e8f3fb; --cold-2:#a9cfee; --deco:rgb(11 13 18 / .32);
  --ig-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* values from instagram.com's own CSS tokens and mobile-web measurements, 30 Oct 2026 (see the README) */
  --ig-bg:#ffffff; --ig-fg:#000000; --ig-muted:#737373; --ig-line:#dbdbdb; --ig-btn:#efefef; --ig-icon-2:#8e8e8e;
  --ig-primary:#4a5df9; --ig-on-primary:#ffffff; --ig-tab-on:#4150f7; --ig-link:#00376b; --ig-heart:#ff3040;
  --ig-on-media:#ffffff; --ig-media-chip:rgb(18 18 18 / .7);
  --ring-1:#14b8a6; --ring-2:#2563eb;   /* our own ring colours, not Instagram's gradient */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --calm-1:#1a2a4a; --calm-2:#2c4f8f; --clear-1:#12343a; --clear-2:#1f6670;
  --fresh-1:#352b1d; --fresh-2:#6b522f; --algae-1:#13301f; --algae-2:#23603f;
  --cold-1:#172a3c; --cold-2:#2d5577; --deco:rgb(238 241 247 / .35);
  --ig-bg:#0c1014; --ig-fg:#f5f5f5; --ig-muted:#a8a8a8; --ig-line:#262626; --ig-btn:#363636; --ig-icon-2:#a8a8a8;
  --ig-tab-on:#708dff; --ig-link:#e0f1ff; --ring-1:#2dd4bf; --ring-2:#7aa2ff}}
:root[data-theme="dark"]{
  --calm-1:#1a2a4a; --calm-2:#2c4f8f; --clear-1:#12343a; --clear-2:#1f6670;
  --fresh-1:#352b1d; --fresh-2:#6b522f; --algae-1:#13301f; --algae-2:#23603f;
  --cold-1:#172a3c; --cold-2:#2d5577; --deco:rgb(238 241 247 / .35);
  --ig-bg:#0c1014; --ig-fg:#f5f5f5; --ig-muted:#a8a8a8; --ig-line:#262626; --ig-btn:#363636; --ig-icon-2:#a8a8a8;
  --ig-tab-on:#708dff; --ig-link:#e0f1ff; --ring-1:#2dd4bf; --ring-2:#7aa2ff}
[data-mood="calm"]{--m1:var(--calm-1);--m2:var(--calm-2)}
[data-mood="clear"]{--m1:var(--clear-1);--m2:var(--clear-2)}
[data-mood="fresh"]{--m1:var(--fresh-1);--m2:var(--fresh-2)}
[data-mood="algae"]{--m1:var(--algae-1);--m2:var(--algae-2)}
[data-mood="cold"]{--m1:var(--cold-1);--m2:var(--cold-2)}

html{scroll-padding:56px 0 56px}   /* keeps focused things clear of the sticky top bar and tab bar */
[hidden]{display:none !important}   /* or a class's display wins over the hidden attribute */

/* ---------- demo strip: our page, outside the mock app ---------- */
.strip{max-width:470px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.demotag{order:3;flex-basis:100%;font:600 .78rem/1.4 var(--body);color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;font:700 .95rem var(--display);color:var(--fg);text-decoration:none;border-radius:999px;padding:0 6px}
.back svg{width:18px;height:18px}
.tools{display:flex;gap:6px;align-items:center}
.themebtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card-2);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.themebtn svg{width:17px;height:17px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card-2)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 .8rem var(--body);padding:5px 10px;border-radius:999px;cursor:pointer;min-height:30px}
.lang button[aria-pressed="true"]{background:var(--pill);color:var(--pill-fg)}

/* ---------- the mock app ---------- */
.app{max-width:470px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--ig-bg);color:var(--ig-fg);font:400 14px/18px var(--ig-font)}
.app main{flex:1}
@media (min-width:600px){
  body{background:var(--card-2)}
  .strip{border:0;margin-top:12px}
  .app{margin:4px auto 0;min-height:auto;border:1px solid var(--line);border-radius:28px;overflow:clip;box-shadow:0 24px 60px -30px var(--shadow)}
}
.ico,.ibtn{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;color:inherit}
.ibtn{padding:0;border:0;background:none;cursor:pointer;border-radius:50%}
.ico svg,.ibtn svg{width:24px;height:24px}
.ibar{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:80px minmax(0,1fr) 80px;align-items:center;height:50px;padding:0 4px;background:var(--ig-bg)}
.ibar .end{display:flex;justify-content:flex-end}
.ibar .handle{font:700 20px/25px var(--ig-font);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* profile header */
.head{display:flex;align-items:center;gap:20px;padding:6px 16px 10px}
.avatar{flex:none;width:96px;height:96px;padding:3px;border:0;border-radius:50%;background:conic-gradient(from 200deg,var(--ring-1),var(--ring-2),var(--ring-1));cursor:pointer}
.avatar svg{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--ig-bg);background:var(--card)}
.headr{flex:1;min-width:0;display:grid;gap:6px}
.dname{font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0;padding:0;list-style:none}
.stats li{display:grid}
.stats b{font:600 16px/20px var(--ig-font)}
@media (max-width:359px){ .stats span{font-size:13px} }
.bio{padding:0 16px;display:grid;gap:1px}
.bio .cat{color:var(--ig-muted)}
.blink{justify-self:start;display:inline-flex;align-items:center;gap:4px;color:var(--ig-link);font-weight:600;text-decoration:none}
.blink svg{width:14px;height:14px}
.actions{display:flex;gap:6px;padding:12px 16px 8px}
.btn{flex:1;display:grid;place-items:center;min-height:36px;border:0;border-radius:8px;font:600 14px var(--ig-font);text-decoration:none;cursor:pointer;background:var(--ig-btn);color:var(--ig-fg)}
.btn.primary{background:var(--ig-primary);color:var(--ig-on-primary)}
.btn.primary.on{background:var(--ig-btn);color:var(--ig-fg)}

/* highlights */
.hl{display:flex;gap:12px;overflow-x:auto;margin:0;padding:6px 16px 14px;list-style:none;scrollbar-width:none}   /* top padding: room for the focus ring, which the scroller clips */
.hl::-webkit-scrollbar{display:none}
.hlb{display:grid;justify-items:center;gap:5px;width:68px;padding:0;border:0;background:none;color:inherit;cursor:pointer;font:400 12px/1.2 var(--ig-font)}
.hlc{display:block;width:66px;height:66px;padding:3px;border-radius:50%;border:1px solid var(--ig-line)}
.hlc svg{display:block;width:100%;height:100%;border-radius:50%;background:linear-gradient(160deg,var(--m1),var(--m2))}
.hll{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tabs and grid */
.tabs{display:flex;border-top:1px solid var(--ig-line)}
.tabs span{flex:1;display:grid;place-items:center;height:44px;color:var(--ig-icon-2)}
.tabs .on{color:var(--ig-fg);box-shadow:inset 0 -2px 0 var(--ig-tab-on)}
.tabs svg{width:24px;height:24px}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px}
.tilebtn{position:relative;display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;color:inherit}
.tilebtn:focus-visible{outline-offset:-3px}
.tilebtn .multi{position:absolute;top:8px;right:8px;width:20px;height:20px;color:var(--ig-on-media);filter:drop-shadow(0 0 2px rgb(0 0 0 / .5))}
.grid .post{aspect-ratio:3/4}

/* one post's picture, drawn at any size with container units, so tile, feed and carousel share the markup */
.post{container-type:inline-size;display:block;position:relative;aspect-ratio:4/5;overflow:hidden;color:var(--fg);background:linear-gradient(160deg,var(--m1),var(--m2));font-family:var(--body)}
.post .deco{position:absolute;inset:0;width:100%;height:100%}
/* first picture: the fjord that day, a bowl painted from the day's dives, with Gabby small on the waterline.
   The feed and tile versions are two SVGs; the container query shows one. Data colours are fixed and read in both themes. */
.post.fj{background:var(--card-2)}
.fj svg{display:block;width:100%;height:100%}
.fj .fj-tile{display:none}
@container (max-width:260px){ .fj .fj-feed{display:none} .fj .fj-tile{display:block} }
.fj-o{fill:none;stroke:var(--fg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fj-k{fill:var(--bg);stroke:var(--fg);stroke-width:2}
.fj-in{stroke-dasharray:4.5 3.5;animation:fjflow 1.4s linear infinite}
@keyframes fjflow{to{stroke-dashoffset:-8}}
.fj-gab{animation:fjbob 4s ease-in-out infinite}
@keyframes fjbob{50%{transform:translateY(.9px)}}
.fj-lab{font:700 7px var(--body);fill:#fff;stroke:rgb(4 16 28 / .6);stroke-width:1.6px;paint-order:stroke;stroke-linejoin:round}
.fj-d{font:800 20px var(--display);fill:var(--fg)}
.fj-s{font:600 12px var(--body);fill:var(--muted)}
.fj-t{font:800 60px var(--display);fill:var(--fg)}
.fj-w{font:700 15px var(--body);fill:var(--fg)}
.fj-dt{font:600 12.5px var(--body);fill:var(--muted)}
.fj-c{font:700 11.5px var(--body);fill:var(--bg)}
.fj-h{font:800 27px var(--display);fill:var(--fg)}
.fj-g{font:700 11.5px var(--body);fill:var(--muted)}
.fj-l{font:600 13px var(--body);fill:var(--muted)}
.fj-v{font:700 14px var(--body);fill:var(--fg)}
.fj-f{font:600 12.5px var(--body);fill:var(--fg)}
.fj-on{fill:var(--accent)}
.fj-off{fill:color-mix(in srgb,var(--muted) 26%,transparent)}
.fj-m{fill:var(--fg);stroke:var(--bg);stroke-width:2}
/* second carousel picture: the day's numbers */
.post.sheet{display:flex;flex-direction:column;gap:2.4cqw;padding:7cqw 6cqw 5cqw}
.sh-t{font:800 7cqw/1.1 var(--display)}
.sh-d{font:600 4.2cqw/1.2 var(--body);color:var(--muted);margin:-1cqw 0 1cqw}
.sh-r{display:flex;align-items:center;justify-content:space-between;gap:3cqw;padding:2.4cqw 3.6cqw;border-radius:3cqw;background:color-mix(in srgb,var(--bg) 80%,transparent)}
.sh-r span{font:600 3.9cqw/1.25 var(--body);color:var(--muted)}
.sh-r b{flex:none;font:800 6.6cqw/1.1 var(--display)}
.sh-n{margin-top:auto;font:600 3.6cqw/1.35 var(--body)}
.rain line{animation:fall 1.6s linear infinite}
@keyframes fall{from{transform:translateY(-6px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.face .eye{transform-box:fill-box;transform-origin:center;animation:blink 6.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}

/* ---------- posts feed ---------- */
.ftitle{flex:1;min-width:0;text-align:center;line-height:1.2}
.ftitle span{display:block;font-size:12px;color:var(--ig-muted);font-weight:600}
.ftitle h2{font:700 16px/1.2 var(--ig-font)}
.fp{padding-bottom:14px}   /* html's scroll-padding already clears the top bar */
.fp:focus{outline:none}
.fp:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.fph{display:flex;align-items:center;gap:10px;padding:8px 4px 8px 12px}
.fph .mini{width:32px;height:32px;border-radius:50%;background:var(--card);flex:none}
.fph .u{display:block;font-weight:600}
.fph .loc{display:block;font-size:12px}
.fph .ico{margin-left:auto}
.car{position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;margin:0;padding:0;list-style:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start}
.cnav{position:absolute;top:50%;translate:0 -50%;width:32px;height:32px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:color-mix(in srgb,var(--ig-bg) 82%,transparent);color:var(--ig-fg);box-shadow:0 1px 4px rgb(0 0 0 / .25)}
.cnav svg{width:16px;height:16px}
/* the app has no arrows: they show on hover and keyboard focus only, and never block a swipe while invisible */
.cnav:not(:focus-visible){opacity:0;pointer-events:none}
@media (hover:hover){ .car:hover .cnav{opacity:1;pointer-events:auto} }
.cnav.prev{left:8px}
.cnav.next{right:8px}
.count{position:absolute;top:12px;right:12px;font:600 12px/1 var(--ig-font);padding:5px 8px;border-radius:999px;background:var(--ig-media-chip);color:var(--ig-on-media)}
.acts{position:relative;display:flex;align-items:center;padding:4px 8px 0}
.heart[aria-pressed="true"] svg{fill:var(--ig-heart);stroke:var(--ig-heart)}
.dots{position:absolute;left:50%;translate:-50% 0;display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ig-line)}
.dots i.on{background:var(--ig-primary)}
.acts .save{margin-left:auto}
.likes{padding:2px 14px 0;font-weight:600}
.cap{padding:4px 14px 0}
.cap .u{font-weight:600}
.cap .txt b{font-weight:inherit}   /* the caption templates bold the numbers for the main page's style; posts read as plain text */
.tags{color:var(--ig-link)}
.when{padding:6px 14px 0;font-size:12px;color:var(--ig-muted)}

/* bottom tab bar, for the look only */
.tabnav{position:sticky;bottom:0;z-index:3;display:flex;justify-content:space-around;align-items:center;min-height:50px;
  padding-bottom:env(safe-area-inset-bottom,0px);background:var(--ig-bg);border-top:1px solid var(--ig-line)}
.tabnav .me{width:26px;height:26px;border-radius:50%;background:var(--ig-btn);box-shadow:0 0 0 2px var(--ig-bg),0 0 0 3.5px var(--ig-fg)}

.foot{max-width:470px;margin:0 auto;padding:14px 16px 28px;font-size:.78rem;line-height:1.5;color:var(--muted);display:grid;gap:6px}

/* ---------- new post types: covers picked by rules from the day's data (draft, see docs/GABBY-NEXT.md) ---------- */
.post.ex{display:flex;flex-direction:column;gap:2.6cqw;padding:6cqw}
.ex>:not(.deco){position:relative}
.chip{align-self:flex-start;font:800 3.8cqw/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2cqw 3.2cqw;border-radius:999px;background:var(--fg);color:var(--bg)}
.ex-t{font:800 7.2cqw/1.12 var(--display)}
.ex-s{font:600 4.2cqw/1.3 var(--body);color:var(--muted)}
.ex-f{margin-top:auto;font:700 4.6cqw/1.3 var(--body)}
.ex-face{position:absolute !important;right:5cqw;bottom:5cqw;width:22cqw;height:22cqw;border-radius:50%;background:var(--card)}
.wk-n{font:800 22cqw/.9 var(--display);margin-top:-1cqw}
.hm{display:block;width:100%;height:65cqw;padding:2cqw;border-radius:3cqw;background:color-mix(in srgb,var(--bg) 82%,transparent)}
.hm text{font:700 6px var(--body);fill:var(--fg)}
.hm .ax{font:600 5px var(--body);fill:var(--muted)}
.hm .gap{fill:none;stroke:var(--muted);stroke-width:.6;stroke-dasharray:2 1.6}
.rec-n{margin-top:auto;font:800 30cqw/.9 var(--display);letter-spacing:-.02em}
.rec-n small{font:800 9cqw var(--display);margin-left:2cqw}
.rec-l{max-width:66cqw;font:800 5.8cqw/1.2 var(--display)}
.wk-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3cqw 5cqw;margin-top:auto;padding:0 2cqw}
.wk-d{display:grid;justify-items:center;gap:1.4cqw;font:700 3.8cqw/1 var(--body)}
.wk-d svg{width:100%;aspect-ratio:1;border-radius:50%;background:linear-gradient(160deg,var(--m1),var(--m2));box-shadow:0 0 0 .8cqw var(--bg)}
.wk-d i{font-style:normal}
.wk-s{font:700 4.4cqw/1.35 var(--body)}
.q-mark{position:absolute !important;right:4cqw;top:0;font:800 50cqw/1 var(--display);opacity:.16}
.q-o{display:flex;gap:3cqw;align-items:center;padding:2.2cqw 3.4cqw;border-radius:3cqw;background:color-mix(in srgb,var(--bg) 82%,transparent);font:800 6.2cqw/1.1 var(--display)}
.q-o i{flex:none;display:grid;place-items:center;width:8cqw;height:8cqw;border-radius:50%;background:var(--fg);color:var(--bg);font:800 4.4cqw/1 var(--body);font-style:normal}
.q-ans{margin-top:4cqw;font:800 17cqw/1 var(--display)}
@container (max-width:260px){
  .post.ex{padding:6cqw;gap:4cqw}
  .ex .ex-t,.ex .ex-s,.ex .ex-f,.ex .rec-l,.ex .wk-s,.ex .q-o,.ex .ex-face,.ex .hm text{display:none}
  .chip{font-size:7.5cqw;padding:3cqw 4.5cqw}
  .hm{margin-top:auto;height:98cqw;padding:0;background:none}
  .wk-n{font-size:40cqw}
  .rec-n{font-size:34cqw}
  .rec-n small{display:block;margin:2cqw 0 0;font-size:11cqw}
  .q-mark{position:static !important;margin:auto;font-size:80cqw;opacity:.85}
  .wk-row{grid-template-columns:repeat(4,minmax(0,1fr));gap:3cqw}
  .wk-d i{display:none}
}

@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important} }
</style>

<svg class="defs" aria-hidden="true" focusable="false"><defs>
  <image id="art-buoy" href="__ASSET_buoy__" width="600" height="736"/>
  <clipPath id="fj-bowl"><path d="M6 34H94V58C94 81 74 96 50 96S6 81 6 58Z"/></clipPath>
</defs></svg>

<div class="strip">
  <a class="back" href="../" id="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    <span data-i="back">Fjordstatus</span>
  </a>
  <p class="demotag" data-i="demoTag"></p>

    <button class="themebtn" id="themebtn" type="button"></button>

      <button id="lang-no" type="button" data-lang="no" lang="nb" aria-label="Norsk">NO</button>
      <button id="lang-en" type="button" data-lang="en" lang="en" aria-label="English">EN</button>
    </div>
  </div>
</div>

<div class="app">
  <main>
    <section id="profileView" aria-labelledby="handle">
      <div class="ibar">
        <span class="ico" data-icon="back" aria-hidden="true"></span>
        <h1 class="handle" id="handle" data-handle></h1>
        <span class="end" aria-hidden="true"><span class="ico" data-icon="bell" id="bell" hidden></span><span class="ico" data-icon="more"></span></span>
      </div>
      <div class="head">
        <button class="avatar" type="button" id="avatar" data-open="0"><svg viewBox="190 285 220 220" aria-hidden="true"><use href="#art-buoy"/><g class="face" id="avatarFace"></g></svg></button>
        <div class="headr">
          <p class="dname" data-i="dname"></p>
          <ul class="stats num">
            <li><b id="nPosts"></b><span data-i="posts"></span></li>
            <li><b id="nFollowers"></b><span data-i="followers"></span></li>
            <li><b id="nFollowing"></b><span data-i="followingLbl"></span></li>
          </ul>
        </div>
      </div>
      <div class="bio">
        <p class="cat" data-i="cat"></p>
        <p data-i="bio1"></p>
        <p data-i="bio2"></p>
        <p data-i="bio3"></p>
        <a class="blink" id="bioLink" href="../"><span data-icon="link" aria-hidden="true"></span>gabriel.sekke.dev</a>
      </div>
      <div class="actions">
        <button class="btn primary" type="button" id="follow"></button>
        <a class="btn" id="cta" href="../" data-i="cta"></a>
      </div>
      <ul class="hl" id="highlights"></ul>
      <div class="tabs" aria-hidden="true">
        <span class="on" data-icon="grid"></span><span data-icon="reels"></span><span data-icon="tagged"></span>
      </div>
      <h2 class="sr" data-i="gridTitle"></h2>
      <ul class="grid" id="grid"></ul>
    </section>

    <section id="feedView" aria-labelledby="feedTitle" hidden>
      <div class="ibar">

// ---------- language (same keys as the main page, so the choice carries over) ----------
function detectLang(){
  const q=new URLSearchParams(location.search).get('lang');
  if(q==='no'||q==='en') return q;
  try{const s=localStorage.getItem('gabriel-lang'); if(s==='no'||s==='en') return s;}catch(e){}
  const langs=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
  return langs.some(l=>/^(nb|nn|no)\b/i.test(l))?'no':'en';
}
let L=detectLang();
const fmt=(v,d=1)=>{
  if(v==null||Number.isNaN(v)) return '–';
  if(Math.abs(v)<0.5*10**-d) v=0;   // no "-0.0"
  return v.toLocaleString(T[L].dateLoc,{minimumFractionDigits:d,maximumFractionDigits:d});
};
const nf=n=>n.toLocaleString(T[L].dateLoc);

// ---------- one fact sheet per day, from the heatmap block (same layers as the main page) ----------
const H=D.heat, SURF=[], DEEP=[];
H.depths.forEach((z,j)=>{ if(z<2) SURF.push(j); if(z>=9) DEEP.push(j); });
const byDay=new Map();
H.ts.forEach((t,i)=>{ const k=t.slice(0,10); if(!byDay.has(k)) byDay.set(k,[]); byDay.get(k).push(i); });   // ts is local time
function mean(p,idx,cols){ let s=0,n=0; for(const i of idx) for(const j of cols){ const v=H[p][i]?.[j]; if(v!=null){s+=v;n++;} } return n?s/n:null; }
function median(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), h=s.length>>1; return s.length%2?s[h]:(s[h-1]+s[h])/2; }
const col=(p,idx)=>H.depths.map((_,j)=>mean(p,idx,[j]));   // the day's mean profile, one value per depth bin
const days=[...byDay].map(([k,idx])=>({k,n:idx.length,
  sT:mean('temperature',idx,SURF),sS:mean('salinity',idx,SURF),sTu:mean('turbidity',idx,SURF),
  sF:mean('fluorescence',idx,SURF),dO:mean('oxygen',idx,DEEP),
  prof:{S:col('salinity',idx),O:col('oxygen',idx),Tu:col('turbidity',idx),F:col('fluorescence',idx)}}));
const DAY=864e5, dayDate=k=>{ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
// fluorescence baseline: only the dives before that day, as a daily post would know it
function fBefore(k){ const v=[]; H.ts.forEach((t,i)=>{ if(t.slice(0,10)<k) SURF.forEach(j=>{ const x=H.fluorescence[i]?.[j]; if(x!=null) v.push(x); }); }); return median(v); }
// Mood rules, checked against Oct 2026: runoff 5-6 and 15-16 Oct, algae 1-4 Oct, cooling 9/17/19 Oct, clear 13-14 Oct.
function moodOf(d,p){
  const drop=p&&p.sS!=null&&d.sS!=null?p.sS-d.sS:0;
  if(d.sS!=null&&(d.sS<10||drop>=6||(drop>=3&&d.sTu!=null&&d.sTu>=1))) return 'fresh';
  if(d.fBase&&d.sF!=null&&d.sF>=2&&d.sF>=2*d.fBase) return 'algae';
  if(p&&p.sT!=null&&d.sT!=null&&d.sT<=p.sT-0.3) return 'cold';
  if(d.sS!=null&&d.sS>=22&&d.sTu!=null&&d.sTu<0.5) return 'clear';   // 22: where the main page starts calling the surface salty
  return 'calm';
}
days.forEach((d,i)=>{
  const p=days[i-1];
  d.prev=p&&dayDate(d.k)-dayDate(p.k)<=1.5*DAY?p:null;   // "the day before" only when it is the day before
  d.fBase=fBefore(d.k);
  d.mood=moodOf(d,d.prev);
});
const lastDay=days[days.length-1];
// the posts: every day in the month of the latest dive, newest first
const month=D.last.slice(0,7);
const posts=days.filter(d=>d.k.slice(0,7)===month).reverse();
const MOODS=['fresh','algae','cold','clear','calm'];
const liked=new Set();
let following=false;
// illustrative like counts: stable per day, a little higher on the eventful days
const likesOf=d=>38+(+d.k.slice(8)*47)%64+{fresh:55,algae:40,cold:20,clear:25,calm:0}[d.mood]+(liked.has(d.k)?1:0);

// mascot face: big glossy eyes, rosy cheeks, a mouth per mood (screen.html draws the same face)
const EYES=`<g class="eye"><ellipse cx="270" cy="364" rx="14" ry="17" fill="#1b2230"/><circle cx="275.5" cy="357" r="5.5" fill="#fff"/><circle cx="265" cy="371.5" r="2.4" fill="#fff" opacity=".8"/></g>
<g class="eye"><ellipse cx="330" cy="364" rx="14" ry="17" fill="#1b2230"/><circle cx="335.5" cy="357" r="5.5" fill="#fff"/><circle cx="325" cy="371.5" r="2.4" fill="#fff" opacity=".8"/></g>`;

function crossUp(pr,th){

  for(let j=0;j<pr.length;j++){ const v=pr[j]; if(v==null) continue;
    if(v>=th) return last?last[1]+(th-last[0])/(v-last[0])*(H.depths[j]-last[1]):0;
    last=[v,H.depths[j]]; }
  return null;
}
// depth from which a profile stays under th down to the bottom; null if the bottom bin is not under it
function staysBelow(pr,th){

  if(!js.length||pr[js.at(-1)]>=th) return null;
  let k=null; for(let i=js.length-1;i>=0;i--) if(pr[js[i]]>=th){ k=js[i]; break; }
  if(k==null) return 0;
  const n=js.find(j=>j>k);
  return H.depths[k]+(pr[k]-th)/(pr[k]-pr[n])*(H.depths[n]-H.depths[k]);
}
// where the run of bins at or over th that starts at the top ends; 0 if the top bin is under th
function topRun(pr,th){

  let last=[pr[0],H.depths[0]];
  for(let j=1;j<pr.length;j++){ const v=pr[j]; if(v==null) continue;
    if(v<th) return last[1]+(last[0]-th)/(last[0]-v)*(H.depths[j]-last[1]);

const wd=k=>dayDate(k).toLocaleDateString(T[L].dateLoc,{weekday:'long'});
const faceSvg=(m,cls)=>`<svg${cls?` class="${cls}"`:''} viewBox="190 285 220 220" aria-hidden="true"><use href="#art-buoy"/><g class="face">${face(m)}</g></svg>`;
const SAL={min:0,max:33,stops:['#f0f9ff','#a5d8ff','#4dabf7','#1c7ed6','#1b3d8f','#0b1f4d']};   // the main page's salinity scale (a data colour)
function salColor(v){
  let x=(v-SAL.min)/(SAL.max-SAL.min); x=Math.max(0,Math.min(1,x));
  const n=SAL.stops.length-1, i=Math.min(n-1,Math.floor(x*n)), f=x*n-i, h=s=>[1,3,5].map(k=>parseInt(s.slice(k,k+2),16)), a=h(SAL.stops[i]), b=h(SAL.stops[i+1]);
  return `rgb(${a.map((c,k)=>Math.round(c+(b[k]-c)*f)).join(' ')})`;
}
function divesOf(k){ const out=[]; H.ts.forEach((t,i)=>{ if(t.startsWith(k)) out.push({h:+t.slice(11,13),t:t.slice(11,16),i,s:mean('salinity',[i],SURF)}); }); return out; }
// how the surface changed between the day's dives, when it moved 8 PSU or more
function swingOf(d){
  const ds=divesOf(d.k).filter(x=>x.s!=null); if(ds.length<3) return null;
  const r=ds.map(x=>r1(x.s)), lo=Math.min(...r), hi=Math.max(...r);
  if(hi-lo<80) return null;
  const v=x=>({v:fmt(x.s),t:x.t});
  return r.every((x,i)=>!i||x<=r[i-1])?{fell:[v(ds[0]),v(ds.at(-1))]}:{swung:[v(ds[r.indexOf(hi)]),v(ds[r.indexOf(lo)])]};
}
function stripSvg(d){
  const slot=Array(8).fill(null); divesOf(d.k).forEach(x=>{ slot[Math.min(7,Math.floor(x.h/3))]=x; });   // 3-hour slots, so a missing dive shows as a gap
  const X0=20,CW=19.4,Y0=12,n=H.depths.filter(z=>z<10).length,RH=100/n,cx=c=>X0+c*CW+(CW-1.6)/2;   // the top 10 m, where the fresh layer shows
  let s='';
  slot.forEach((x,c)=>{
    const x0=X0+c*CW;
    if(!x) s+=`<rect class="gap" x="${x0+.4}" y="${Y0+.4}" width="${CW-2.4}" height="${n*RH-.8}" rx="1.5"/><text class="ax" x="${cx(c)}" y="8" text-anchor="middle">–</text>`;
    else{
      for(let j=0;j<n;j++){ const v=H.salinity[x.i]?.[j]; if(v!=null) s+=`<rect x="${x0}" y="${Y0+j*RH}" width="${CW-1.6}" height="${RH+.05}" fill="${salColor(v)}"/>`; }
      s+=`<text x="${cx(c)}" y="8" text-anchor="middle">${fmt(x.s)}</text>`;
    }
    s+=`<text class="ax" x="${cx(c)}" y="${Y0+n*RH+7}" text-anchor="middle">${String(c*3).padStart(2,'0')}</text>`;
  });
  s+=`<text class="ax" x="0" y="${Y0+4}">0${NB}m</text><text class="ax" x="0" y="${Y0+n*RH-1}">10${NB}m</text>`;
  return `<svg class="hm" viewBox="0 0 176 ${Y0+n*RH+10}" preserveAspectRatio="none" aria-hidden="true">${s}</svg>`;
}
const stripCover=d=>{ const t=T[L].ex, ds=divesOf(d.k).filter(x=>x.s!=null);
  return `<span class="post ex" data-mood="${d.mood}"><span class="chip">${t.strip}</span><span class="ex-t">${longDate(d.k)}</span>${stripSvg(d)}<span class="ex-s">${t.stripLeg}</span><span class="ex-f">${t.stripFoot(fmt(ds[0].s),fmt(ds.at(-1).s))}</span>${faceSvg(d.mood,'ex-face')}</span>`; };
// ponytail: hard-coded from data/*.csv (surface 0-2 m daily means, 2015-2026); compute it in scripts/prep_data.py next
const REC={'2026-10-06':{rank:3,of:1705,fresher:['2016-08-10','2016-08-14']}};
const recCover=d=>{ const t=T[L].ex, r=REC[d.k];
  return `<span class="post ex" data-mood="${d.mood}"><svg class="deco" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${DECO[d.mood]}</svg><span class="chip">${t.top3}</span><span class="ex-s">${longDate(d.k)}</span><span class="rec-n num">${fmt(d.sS)}<small>PSU</small></span><span class="rec-l">${t.recLine(r.rank,nf(r.of))}</span>${faceSvg(d.mood,'ex-face')}</span>`; };
function isoWeek(k){ const t=dayDate(k), u=new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())), w=u.getUTCDay()||7; u.setUTCDate(u.getUTCDate()+4-w); return Math.ceil(((u-Date.UTC(u.getUTCFullYear(),0,1))/DAY+1)/7); }
const weekOf=d=>posts.filter(x=>{ const g=(dayDate(d.k)-dayDate(x.k))/DAY; return g>=0&&g<6.5; }).reverse();   // Monday to this Sunday, oldest first
const isRecap=d=>dayDate(d.k).getDay()===0&&weekOf(d).length===7;
const weekCover=d=>{ const t=T[L].ex, w=weekOf(d), S=w.map(x=>x.sS);
  return `<span class="post ex" data-mood="${d.mood}"><span class="chip">${t.weekWord}</span><span class="wk-n num">${isoWeek(d.k)}</span><span class="ex-t">${t.weekT}</span>`
    +`<span class="wk-s">${t.weekStats(nf(w.reduce((a,x)=>a+x.n,0)),fmt(Math.min(...S)),fmt(Math.max(...S)),fmt(w[0].sT),fmt(w[6].sT))}</span>`
    +`<span class="wk-row">${w.map(x=>`<span class="wk-d" data-mood="${x.mood}">${faceSvg(x.mood)}<i>${dayDate(x.k).toLocaleDateString(T[L].dateLoc,{weekday:'narrow'})}</i></span>`).join('')}</span></span>`; };
const QUIZ='2026-10-14', BOT=H.depths.length-1;   // ponytail: one fixed quiz day; a Wednesday rule with rotating questions is next (docs/GABBY-NEXT.md)
const quizVals=d=>{ const idx=byDay.get(d.k); return {deep:fmt(d.dO,0),top:fmt(mean('oxygen',idx,SURF),0),bot:fmt(mean('oxygen',idx,[BOT]),1)}; };
const quizQ=d=>{ const t=T[L].ex, q=quizVals(d);
  return `<span class="post ex" data-mood="${d.mood}"><span class="q-mark" aria-hidden="true">?</span><span class="chip">${t.quiz}</span><span class="ex-t">${t.quizQ}</span><span class="ex-s">${t.quizSub(d.n)}</span>`
    +[['A',q.deep],['B',q.top],['C',q.bot]].map(([l,v])=>`<span class="q-o"><i>${l}</i>${v}${NB}%</span>`).join('')+`<span class="ex-f">${t.quizSwipe}</span></span>`; };
const quizA=d=>{ const t=T[L].ex, q=quizVals(d);
  return `<span class="post ex" data-mood="${d.mood}"><span class="chip">${t.answer}</span><span class="q-ans num">${t.quizA(q.bot)}</span><span class="ex-t">${t.quizWhy(q.deep,q.top)}</span>${faceSvg(d.mood,'ex-face')}</span>`; };
// the slides of a post: the fjord picture, then an extra cover when a rule picks one, then the numbers
function slidesOf(d){
  const lead=d.k===QUIZ?[quizQ(d),quizA(d)]:REC[d.k]?[recCover(d)]:isRecap(d)?[weekCover(d)]:swingOf(d)?[stripCover(d)]:[];
  return [card(d),...lead,sheet(d)];   // the fjord picture leads every post; [...lead,card(d),sheet(d)] puts the extra covers first
}
// captions picked from the day's context, falling back to the mood's own template
function captionEx(d){
  const t=T[L].ex, p=d.prev, base=caption(d), mo=posts.filter(x=>x.k<d.k&&x.k.slice(0,7)===d.k.slice(0,7));
  if(REC[d.k]){ const r=REC[d.k], f=r.fresher.map(dayMonth); return t.recCap(fmt(d.sS),r.rank,nf(r.of),f.join(' '+t.and+' ')+' '+r.fresher[0].slice(0,4)); }
  if(isRecap(d)){ const w=weekOf(d), lo=w.reduce((a,x)=>x.sS<a.sS?x:a), fresh=w.some(x=>x.mood==='fresh');
    return t.weekCap(isoWeek(d.k),nf(w.reduce((a,x)=>a+x.n,0)),fresh?t.weekFresh(wd(lo.k),fmt(lo.sS),fmt(d.sS)):'',fmt(w[0].sT),fmt(d.sT)); }
  if(d.k===QUIZ) return t.quizCap+base;
  const sw=swingOf(d);
  if(sw) return base+(sw.fell?t.fell(...sw.fell):t.swung(...sw.swung));
  if(d.mood==='algae'&&p&&p.mood==='algae'){
    let n=1; for(let x=p;x&&x.mood==='algae';x=x.prev) n++;
    const streak=days.filter(x=>x.mood==='algae'&&x.k<=d.k&&(dayDate(d.k)-dayDate(x.k))/DAY<n-.5);
    if(streak.every(x=>x.sF<=d.sF)) return t.algaeUp(n,fmt(d.sF,2),d.fBase?fmt(d.sF/d.fBase,0):'–',dayDate(days[0].k).toLocaleDateString(T[L].dateLoc,{day:'numeric',month:'long'}));
    return t.algaeStill(n,fmt(d.sF,2),fmt(p.sF,2),d.sF>p.sF);
  }
  if(d.mood==='calm'&&p){
    if(r1(d.sT)===r1(p.sT)) return t.calmSame(fmt(d.sT),fmt(d.sS));
    const i=mo.filter(x=>x.mood==='calm').length%3;
    if(i===1&&d.dO!=null&&d.dO<40) return t.calmDeep(fmt(d.sT),fmt(d.dO,0));
    if(i===2) return t.calmDelta(fmt(d.sT),fmt(Math.abs(d.sT-p.sT)),d.sT>p.sT);
  }
  if(d.mood==='cold'&&p&&mo.length&&r1(d.sT)<Math.min(...mo.map(x=>r1(x.sT)))){
    const i=mo.filter(x=>x.mood==='cold').length;
    if(i===1) return t.coldLow(fmt(d.sT),fmt(p.sT-d.sT));
    if(i>=2) return t.coldAgain(fmt(d.sT),fmt(p.sT-d.sT));
  }
  if(d.mood==='clear'){ const w=days.find(x=>Math.round((dayDate(d.k)-dayDate(x.k))/DAY)===7);
    if(w&&Math.abs(d.sS-w.sS)>=10) return t.clearWeek(wd(w.k),fmt(w.sS),fmt(d.sS),fmt(d.sT)); }
  return base;
}
function article(d,i){
  const t=T[L], sl=slidesOf(d);
  // only our own strings and formatted numbers go into this HTML
  return `<article class="fp" id="p${i}" tabindex="-1" aria-label="${tileLabel(d)}">
<div class="fph">${mini(d.mood)}<span><b class="u">${HANDLE}</b><span class="loc">${t.loc}</span></span><span class="ico" aria-hidden="true">${ICON.more}</span></div>
<div class="car">
<ul class="slides" tabindex="-1">${sl.map(s=>`<li class="slide">${s}</li>`).join('')}</ul>
<button class="cnav prev" type="button" aria-label="${t.prevImg}" hidden>${ICON.back}</button>
<button class="cnav next" type="button" aria-label="${t.nextImg}">${ICON.next}</button>
<span class="count" aria-hidden="true">1/${sl.length}</span>
</div>
<div class="acts"><button class="ibtn heart" type="button" data-like="${d.k}" aria-pressed="${liked.has(d.k)}" aria-label="${t.like}">${ICON.heart}</button>
<span class="ico" aria-hidden="true">${ICON.comment}</span><span class="ico" aria-hidden="true">${ICON.send}</span>
<span class="dots" aria-hidden="true">${sl.map((_,j)=>`<i${j?'':' class="on"'}></i>`).join('')}</span><span class="ico save" aria-hidden="true">${ICON.save}</span></div>
<p class="likes num">${t.likes(nf(likesOf(d)))}</p>
<p class="cap"><b class="u">${HANDLE}</b> <span class="txt">${captionEx(d)}</span> <span class="tags">#StoreLungegårdsvann #Bergen #Gabriel</span></p>
<p class="when"><time datetime="${d.k}">${dayMonth(d.k)}</time></p>
</article>`;
}

// ---------- page ----------
const grid=document.getElementById('grid'), feed=document.getElementById('feed');
const profileView=document.getElementById('profileView'), feedView=document.getElementById('feedView');
function renderFollow(){
  const b=document.getElementById('follow');
  b.textContent=following?T[L].following:T[L].follow;
  b.classList.toggle('on',following);
  document.getElementById('nFollowers').textContent=nf(FOLLOWERS+(following?1:0));
  document.getElementById('bell').hidden=!following;   // the app shows the bell only on accounts you follow
}
function render(){
  const t=T[L];
  document.documentElement.lang=L==='no'?'nb':'en';
  document.title=t.title;
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent=t[el.dataset.i]; });
  document.querySelectorAll('[data-handle]').forEach(el=>{ el.textContent=HANDLE; });
  document.getElementById('langGroup').setAttribute('aria-label',t.ariaLang);
  ['no','en'].forEach(l=>document.getElementById('lang-'+l).setAttribute('aria-pressed',l===L));
  document.getElementById('avatarFace').innerHTML=face(posts[0].mood);
  document.getElementById('avatar').setAttribute('aria-label',t.avatarAria);
  document.getElementById('nPosts').textContent=nf(posts.length);
  document.getElementById('nFollowing').textContent=nf(FOLLOWING);
  renderFollow();
  document.getElementById('highlights').innerHTML=MOODS.filter(m=>posts.some(p=>p.mood===m)).map(m=>
    `<li><button class="hlb" type="button" data-open="${posts.findIndex(p=>p.mood===m)}" aria-label="${t.hlAria(t.mood[m])}"><span class="hlc" data-mood="${m}"><svg viewBox="190 285 220 220" aria-hidden="true"><use href="#art-buoy"/><g class="face">${face(m)}</g></svg></span><span class="hll">${t.mood[m]}</span></button></li>`).join('');
  grid.innerHTML=posts.map((d,i)=>`<li><button class="tilebtn" type="button" data-open="${i}" aria-label="${tileLabel(d)}">${slidesOf(d)[0]}${ICON.multi}</button></li>`).join('');
  feed.innerHTML=posts.map(article).join('');
  document.getElementById('feedBack').setAttribute('aria-label',t.feedBack);
  ['back','cta','bioLink'].forEach(id=>{ document.getElementById(id).href='../?lang='+L; });   // keep the language across pages
  const last=new Date(D.last.replace(' ','T'));
  document.getElementById('foot2').textContent=t.foot2(last.toLocaleDateString(t.dateLoc,{day:'numeric',month:'long',year:'numeric'}));
  document.getElementById('foot3').innerHTML=t.foot3;   // our own fixed string, with the font licence links
  renderThemeBtn();
}

// ---------- open a post: the feed view, scrolled to it, like the app does ----------
let opener=null, openerList=null, cur=0;
history.scrollRestoration='manual';   // or the browser's restore on back undoes showProfile's scroll
function openFeed(i,from){
  opener=from; openerList=from.parentElement.closest('#highlights,#grid,.head'); cur=i;
  if(feedView.hidden){ profileView.hidden=true; feedView.hidden=false; history.pushState({gabbyFeed:1},''); }
  const a=document.getElementById('p'+i);
  a.scrollIntoView({block:'start',behavior:'instant'});
  a.focus({preventScroll:true});
}
function showProfile(){
  feedView.hidden=true; profileView.hidden=false;
  // a language switch re-renders the lists, so find the opener's replacement in the same list
  const back=opener&&opener.isConnected?opener:(openerList||grid).querySelector(`[data-open="${cur}"]`);
  back.scrollIntoView({block:'center',behavior:'instant'});
  back.focus({preventScroll:true});
}
profileView.addEventListener('click',e=>{ const b=e.target.closest('[data-open]'); if(b) openFeed(+b.dataset.open,b); });
document.getElementById('feedBack').addEventListener('click',()=>{ if(history.state&&history.state.gabbyFeed) history.back(); else showProfile(); });
addEventListener('popstate',()=>{ if(!feedView.hidden) showProfile(); });
document.addEventListener('keydown',e=>{   // on the document, so Escape works wherever focus is
  if(feedView.hidden) return;
  if(e.key==='Escape'){ document.getElementById('feedBack').click(); return; }
  if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey) return;   // Alt+Left is the browser's back
  const s=(e.key==='ArrowLeft'||e.key==='ArrowRight')&&e.target.closest?.('.fp')?.querySelector('.slides');
  if(s){ e.preventDefault(); s.scrollBy({left:(e.key==='ArrowRight'?1:-1)*s.clientWidth,behavior:smooth()}); }
});
document.getElementById('follow').addEventListener('click',()=>{ following=!following; renderFollow(); });

// likes and carousels
const smooth=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth';
feed.addEventListener('click',e=>{
  const h=e.target.closest('.heart');
  if(h){
    const k=h.dataset.like;
    if(liked.has(k)) liked.delete(k); else liked.add(k);
    h.setAttribute('aria-pressed',liked.has(k));
    h.closest('.fp').querySelector('.likes').textContent=T[L].likes(nf(likesOf(posts.find(p=>p.k===k))));
    return;
  }
  const n=e.target.closest('.cnav');
  if(n){ const s=n.parentElement.querySelector('.slides'); s.scrollBy({left:(n.classList.contains('next')?1:-1)*s.clientWidth,behavior:smooth()}); }
});
feed.addEventListener('scroll',e=>{   // scroll doesn't bubble, so this listens in the capture phase
  const s=e.target;
  if(!s.classList||!s.classList.contains('slides')) return;
  const i=Math.round(s.scrollLeft/s.clientWidth), last=s.children.length-1, car=s.parentElement;
  const prev=car.querySelector('.prev'), next=car.querySelector('.next');
  // show the other button and move focus to it before hiding the focused one, or focus falls back to <body>
  if(i>0) prev.hidden=false;
  if(i<last) next.hidden=false;
  if(i===last&&document.activeElement===next) prev.focus();
  if(i===0&&document.activeElement===prev) next.focus();
  prev.hidden=i===0; next.hidden=i===last;
  car.querySelector('.count').textContent=`${i+1}/${last+1}`;
  car.closest('.fp').querySelectorAll('.dots i').forEach((dot,j)=>dot.classList.toggle('on',j===i));
},true);

// ---------- language and theme ----------
document.getElementById('langGroup').addEventListener('click',e=>{
  const b=e.target.closest('button[data-lang]');
  if(b&&b.dataset.lang!==L){ L=b.dataset.lang; try{localStorage.setItem('gabriel-lang',L);}catch(_){} render(); }
});
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const mq=window.matchMedia('(prefers-color-scheme: dark)');
try{const s=localStorage.getItem('gabriel-theme'); if(s==='light'||s==='dark') document.documentElement.dataset.theme=s;}catch(e){}
const effTheme=()=>document.documentElement.dataset.theme||(mq.matches?'dark':'light');
function renderThemeBtn(){
  const dark=effTheme()==='dark', b=document.getElementById('themebtn');
  b.innerHTML=dark?SUN:MOON;
  b.setAttribute('aria-label',dark?T[L].themeToLight:T[L].themeToDark);
}
document.getElementById('themebtn').addEventListener('click',()=>{
  const next=effTheme()==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  try{localStorage.setItem('gabriel-theme',next);}catch(e){}
  renderThemeBtn();
});
if(mq.addEventListener) mq.addEventListener('change',renderThemeBtn);

render();
</script>
